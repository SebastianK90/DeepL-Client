name: Dependency and supply chain security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
      - name: Check workflow supply chain policy
        run: node scripts/security-supply-chain.cjs
      - name: Test dependency policy failure cases
        run: node --test scripts/security-dependencies.test.cjs scripts/security-supply-chain.test.cjs
      - name: Current OSV scan and verified GLib backport
        run: node scripts/security-dependencies.cjs
