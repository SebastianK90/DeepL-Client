[package]
name = "deepl-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent Windows and Linux desktop translation client with Quick Assist, local OCR and document translation"
publish = false

[workspace]
members = ["vendor/msedge-tts"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
async-tungstenite = { version = "0.34.1", default-features = false, features = ["tokio-runtime", "tokio-rustls-platform-verifier"] }
futures-util = "0.3"
rmpv = "1.3"
scraper = { version = "0.27", default-features = false }
encoding_rs = "0.8"
base64 = "0.22"
brotli-decompressor = { version = "6", default-features = false, features = ["std"] }
msedge-tts = { version = "=0.4.1", default-features = false, features = ["tokio-runtime"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
async-trait = "0.1"
arboard = { version = "3", features = ["wayland-data-control"] }
directories = "6"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
ttf-parser = "0.25"
tauri = { version = "2", features = ["tray-icon"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["xinput"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
msedge-tts = { path = "vendor/msedge-tts" }

[package.metadata.appimage]
assets = ["assets/icon.png"]
icon = "assets/icon.png"
auto_link = true
auto_link_exclude_list = ["libc.so*", "libdl.so*", "libpthread.so*", "libm.so*", "librt.so*", "ld-linux*"]

